<!DOCTYPE html>
<html lang="sl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
    crossorigin="anonymous"></script>
  <link href="styles.css" rel="stylesheet">
  <link href="kontakt.css" rel="stylesheet">
  <meta name="description" content="Kontakt za vprašanja o projektih iz elektronike, programiranja in 3D tiskanja.">
  <title>Kontakt | Cek Luka</title>
</head>

<body>
  <header></header>
  <main>
  <section id="kontakt_form">
    <div id="h-text">
      <h1>Kontaktiraj me</h1>
      <p>Za vprašanja o projektih ali sodelovanju mi lahko pišete na <a href="mailto:jaz@cekluka.com">jaz@cekluka.com</a> ali uporabite obrazec.</p>
      <form action="https://formsubmit.co/jaz@cekluka.com" class="gpfont" method="POST">
        <label for="ime">Ime*<input type="text" id="ime" name="name" autocomplete="given-name" required placeholder="Vaše ime"></label>
        <label for="priimek">Priimek<input type="text" id="priimek" name="priimek" autocomplete="family-name" placeholder="Vaš priimek"></label>
        <label for="email">Vaš email*<input type="email" id="email" name="email" autocomplete="email" required placeholder="Vaš e-poštni naslov"></label>
        <label for="sporocilo">Sporočilo*<textarea id="sporocilo" name="message" placeholder="Vpišite svoje sporočilo" required></textarea></label>
        <button type="submit">Pošlji</button>
      </form>
      <p style="font-size: 14px;">Obrazec uporablja storitev FormSubmit.</p>
    </div>
  </section>
  </main>
  <footer></footer>
  <script src="/site.js" defer></script>
</body>

</html>
